# Non-secret configuration for a deployed agent-service environment (example —
# real values land with the first deployed environment). Secrets are NEVER
# here: ANVILKIT_SIGNING_KEY, ANVILKIT_ENCRYPTION_KEY, and the per-role
# database URLs (which embed credentials) arrive via the
# anvilkit-agent-service-secrets Secret per ADR-006.
#
# ANVILKIT_STREAM_CURSOR_SPOOL is deliberately absent: it is declared beside
# its volumeMount in agent-service-statefulset.yaml so the configured path and
# the mounted path cannot drift apart.
#
# The /etc/anvilkit/* paths below name operator-distributed trust material
# (ADR-006, ADR-016). This example states where the service expects to read
# them; delivering them into the pod is the secret-management mechanism's job
# and is not modelled here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anvilkit-agent-service-config
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: anvilkit-platform
data:
  # Staging is a deployed environment: it refuses every controlled, fake, and
  # mock implementation and the in-process runtime exactly as production does,
  # and requires the same runtime trust material. Only an explicitly declared
  # development or test environment admits controlled implementations.
  ANVILKIT_ENVIRONMENT: "staging"
  ANVILKIT_HTTP_ADDRESS: ":8080"
  # The directory that *contains* `contracts/`: the runtime appends the
  # subdirectory itself. The image places the pinned canonical material at
  # /opt/anvilkit/contracts, so the root is /opt/anvilkit. The image already
  # sets this; it is restated here so the deployed value is visible where the
  # rest of the configuration is read.
  ANVILKIT_CONTRACT_ROOT: "/opt/anvilkit"
  ANVILKIT_MIGRATION_MODE: "validate"
  # Authentication and current-authority material (ADR-002, ADR-016).
  ANVILKIT_AUTH_TRUST_SNAPSHOT: "/etc/anvilkit/trust.json"
  ANVILKIT_AUTH_ISSUERS: "urn:anvilkit:issuer:platform"
  ANVILKIT_AUTH_AUDIENCE: "urn:anvilkit:audience:agent-service"
  ANVILKIT_POLICY_SNAPSHOT: "/etc/anvilkit/policy.json"
  ANVILKIT_CAPABILITY_SNAPSHOT: "/etc/anvilkit/capability.json"
  # The approved Agent definition catalog is authenticated against an
  # operator-distributed trust root; production never trusts its own copy.
  ANVILKIT_DEFINITION_TRUST_ROOT: "/etc/anvilkit/definition-trust-root.json"
  ANVILKIT_DEFINITION_ATTESTATION: "/etc/anvilkit/definition-catalog.dsse.json"
  # The approved runtime release catalog is authenticated the same way: a
  # release set the service signed for itself would approve whatever it happened
  # to carry.
  ANVILKIT_RUNTIME_TRUST_ROOT: "/etc/anvilkit/runtime-trust-root.json"
  ANVILKIT_RUNTIME_ATTESTATION: "/etc/anvilkit/runtime-releases.dsse.json"
  # How a selected runtime release is reached, and where each runtime unit
  # answers. Production accepts only a transport that crosses a process
  # boundary: which unit must serve the work is contract material, where that
  # unit is deployed is not.
  ANVILKIT_RUNTIME_DISPATCHER: "http"
  ANVILKIT_RUNTIME_ENDPOINTS: "runtime.platform.page-change-manager=https://page-change-manager.internal,runtime.platform.page-candidate-specialist=https://page-candidate-specialist.internal"
  ANVILKIT_RUNTIME_DISPATCH_TIMEOUT: "2m"
  # The two halves of the execution boundary's own authentication.
  #
  # The credential key identity names the key this service mints task-scoped
  # credentials with; its public half is what the operator publishes in the
  # credential trust root that both this service and every runtime unit read.
  # Distributing that document independently is the point: the service that
  # mints credentials must not also decide which keys are trusted to mint them.
  ANVILKIT_RUNTIME_CREDENTIAL_KEY_ID: "urn:anvilkit:key:agent-service-task-credential"
  ANVILKIT_RUNTIME_CREDENTIAL_TRUST_ROOT: "/etc/anvilkit/task-credential-trust-root.json"
  # The signing trust store maps a runtime result-signing key to the runtime
  # units, audiences, released manifests, and image provenances it is approved
  # to sign for. A result signed by a key outside it cannot be attributed to a
  # release, and an unattributable result commits nothing.
  ANVILKIT_RUNTIME_SIGNING_TRUST: "/etc/anvilkit/runtime-signing-trust.json"
  # Externally owned services — contracts and authenticated APIs only.
  ANVILKIT_PAGIX_URL: "https://pagix.internal"
  ANVILKIT_CONTRACT_RUNTIME_URL: "https://contract-runtime.internal"
  ANVILKIT_OBJECT_STORE_URL: "https://object-store.internal"
  ANVILKIT_RECEIPT_JOURNAL_URL: "https://journal.internal"
  ANVILKIT_RECOVERY_REGISTER_URL: "https://register.internal"
  # The time authority signs its answers, and the service verifies them against
  # operator-distributed trust material. The trust root is distributed
  # separately from the endpoint on purpose: material that authenticates a
  # source must never be fetched from that source.
  ANVILKIT_AUTHORITATIVE_TIME_URL: "https://time.internal"
  ANVILKIT_AUTHORITATIVE_TIME_TRUST_REF: "urn:anvilkit:issuer:time-authority"
  ANVILKIT_AUTHORITATIVE_TIME_TRUST_ROOT: "/etc/anvilkit/time-trust-root.json"
  # The service's only protected-audit credential, and it is the narrow one:
  # the login behind this endpoint may append to the chain and read it, and
  # may do nothing else to it.
  #
  # There is deliberately no administrative audit credential in this ConfigMap
  # or in this workload's Secret. Establishing the table, its barriers, and
  # that grant is the job of the protected-audit provisioner
  # (agent-service-protected-audit-provisioning.yaml), which runs before the
  # service and exits. A long-running process configured with a credential
  # that owns the audit table owns the account of its own security decisions
  # for as long as it runs, whether it ever uses that credential or not, and
  # every barrier on the table is then one the process could remove.
  ANVILKIT_PROTECTED_AUDIT_URL: "https://audit.internal"
  # What an agent's tools may reach, and how much untrusted content one of
  # them may place in a run's memory. The allowlist is the whole policy: a
  # destination not named here is not reachable, and a deployment that names
  # none has an agent that reaches nothing outside.
  ANVILKIT_EGRESS_ALLOWLIST: ""
  ANVILKIT_EGRESS_MAXIMUM_BYTES: "1048576"
  ANVILKIT_EGRESS_TIMEOUT: "5s"
  ANVILKIT_MEMORY_ADMISSION_BYTES: "65536"
  # Event stream and durable public cursor semantics (ADR-020).
  ANVILKIT_EVENT_RETENTION: "720h"
  ANVILKIT_SSE_HEARTBEAT: "15s"
  ANVILKIT_SSE_WRITE_TIMEOUT: "10s"
  ANVILKIT_SSE_CONNECTIONS: "256"
  ANVILKIT_AUTH_REVALIDATION: "60s"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
