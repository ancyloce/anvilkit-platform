# anvilkit-agent-service — deployed as a StatefulSet because each instance owns
# durable local state: the stream-cursor spool (ADR-024).
#
# When a client's event stream ends, the service records the last public cursor
# that client actually received before the connection closes. If the
# authoritative cursor store refuses that write, the record is held on this
# volume until the reconciler places it — at the next start, or the next sweep.
# The record is the only account of what a disconnected client had, so the
# volume must outlive the pod that wrote it. A Deployment cannot express that:
# emptyDir dies with the pod, and a shared ReadWriteMany claim would put the
# guarantee on storage not every cluster has.
#
# Secrets are injected per ADR-006 — never from the repo. The referenced Secret
# (anvilkit-agent-service-secrets) carries ANVILKIT_SIGNING_KEY,
# ANVILKIT_ENCRYPTION_KEY, and the per-role database URLs, which embed
# credentials. The ConfigMap carries the non-secret configuration
# (see agent-service-config.example.yaml).
#
# Sizing below is a proposed default, not a validated one: design 0005 leaves
# topology, replicas, and autoscaling evidence-driven, so these values are
# re-profiled in staging before launch review exactly as ADR-012 requires of
# the worker.
#
# The headless Service is required by the StatefulSet and gives each instance
# stable DNS (agent-service-0.agent-service). External routing — an
# ingress-facing Service, Ingress, or Gateway — is a separate decision and is
# deliberately not made here.
apiVersion: v1
kind: Service
metadata:
  name: agent-service
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: anvilkit-platform
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: agent-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-service
  labels:
    app.kubernetes.io/name: agent-service
    app.kubernetes.io/part-of: anvilkit-platform
spec:
  serviceName: agent-service
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-service
  # Held disconnect records must survive both a scale-down and a delete of the
  # StatefulSet itself: a claim reclaimed while it still holds records would
  # discard the only account of what those clients received.
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-service
    spec:
      # The ordered shutdown budget is 20s (ingress drain, stream reconnect,
      # executor checkpoint, lease cleanup); the grace period leaves margin
      # above it so the last stage is never cut off mid-cleanup.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # fsGroup is what makes the mounted claim writable by the non-root
        # user. Without it the spool's startup probe fails and the instance
        # refuses to serve — which is correct, but avoidable.
        fsGroup: 65532
      containers:
        - name: agent-service
          image: ghcr.io/ancyloce/anvilkit-agent-service:IMAGE_TAG # immutable tag (ADR-008); never :latest
          envFrom:
            - configMapRef:
                name: anvilkit-agent-service-config
            - secretRef:
                name: anvilkit-agent-service-secrets
          env:
            # Declared beside the mount rather than in the ConfigMap so the
            # configured path and the mounted path cannot drift apart.
            - name: ANVILKIT_STREAM_CURSOR_SPOOL
              value: /var/lib/anvilkit/stream-cursors
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: stream-cursor-spool
              mountPath: /var/lib/anvilkit/stream-cursors
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            # The spool is the only path the service writes to, and it is a
            # mounted volume, so the root filesystem stays read-only.
            readOnlyRootFilesystem: true
  volumeClaimTemplates:
    - metadata:
        name: stream-cursor-spool
        labels:
          app.kubernetes.io/name: agent-service
          app.kubernetes.io/part-of: anvilkit-platform
      spec:
        accessModes:
          - ReadWriteOnce
        # No storageClassName: the cluster default applies. Any class that
        # survives pod rescheduling satisfies the requirement; the spool holds
        # small JSON records, so capacity is nominal.
        resources:
          requests:
            storage: 1Gi
