# Platform CI (EW-REPO-003/004, EW-CONTRACT-004/005; ADR-008:
# GitHub Actions). Stages per PLAN-0001 §10. The worker repo (submodule)
# carries its own CI; this pipeline owns the contracts (validation, codegen
# drift, freeze), the mocks module, the monorepo-wide dependency audit, the
# worker build/test against the pinned submodule, and the container image
# builds (build-only; publishing joins with the first deployed environment).
#
# Every step here runs from a clean checkout of tracked content alone. A check
# whose inputs are the retained local evidence ADR-023 keeps out of Git belongs
# in scripts/release-precheck.sh, not in this pipeline.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (validate, codegen drift, freeze)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install pinned Bun workspace
        run: bun install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/contracts-go/go.mod
      - name: Validate fixtures + regenerate Go bindings (legacy export, ADR-001)
        run: bun packages/contracts-codegen/generate.ts
      - name: Contract freeze intact (ADR-001, AC-029)
        run: bun packages/contracts-codegen/check-freeze.ts
      - name: Canonical Agent contracts (sources, registries, fixtures, separation)
        run: bun packages/contracts-codegen/check-agent-contracts.ts
      - name: Canonical OpenAPI and AsyncAPI selected-tool lint
        run: bun packages/contracts-codegen/check-agent-specs.ts
      - name: Install pinned Agent generators
        run: bash packages/contracts-codegen/prepare-agent-generators.sh "$GITHUB_ENV"
      - name: Regenerate canonical Go and TypeScript packages
        run: bun packages/contracts-codegen/generate-agent-packages.ts
      - name: Canonical TypeScript package
        run: bun run --cwd packages/contracts-typescript check
      - name: Canonical Go package
        working-directory: packages/contracts-go
        run: go test -race -count=1 ./...
      - name: Go and TypeScript canonical parity (fixtures, identity, signing)
        run: |
          mkdir -p /tmp/anvilkit-agent-parity
          bun packages/contracts-codegen/emit-typescript-conformance.ts --repository-root . > /tmp/anvilkit-agent-parity/typescript.json
          (cd packages/contracts-go && GOCACHE=/tmp/anvilkit-agent-go-cache go run ./cmd/conformance --repository-root ../.. > /tmp/anvilkit-agent-parity/go.json)
          bun packages/contracts-codegen/compare-agent-conformance.ts --repository-root . --result /tmp/anvilkit-agent-parity/go.json --result /tmp/anvilkit-agent-parity/typescript.json > /tmp/anvilkit-agent-parity/summary.json
          bun packages/contracts-codegen/emit-typescript-identity.ts --repository-root . > /tmp/anvilkit-agent-parity/typescript-identity.json
          (cd packages/contracts-go && GOCACHE=/tmp/anvilkit-agent-go-cache go run ./cmd/identity-conformance --repository-root ../.. > /tmp/anvilkit-agent-parity/go-identity.json)
          bun packages/contracts-codegen/compare-agent-identity.ts --repository-root . --result /tmp/anvilkit-agent-parity/go-identity.json --result /tmp/anvilkit-agent-parity/typescript-identity.json > /tmp/anvilkit-agent-parity/identity-summary.json
          bun packages/contracts-codegen/emit-typescript-signature.ts --repository-root . > /tmp/anvilkit-agent-parity/typescript-signature.json
          (cd packages/contracts-go && GOCACHE=/tmp/anvilkit-agent-go-cache go run ./cmd/signature-conformance --repository-root ../.. > /tmp/anvilkit-agent-parity/go-signature.json)
          bun packages/contracts-codegen/compare-agent-signature.ts --repository-root . --result /tmp/anvilkit-agent-parity/go-signature.json --result /tmp/anvilkit-agent-parity/typescript-signature.json > /tmp/anvilkit-agent-parity/signature-summary.json
      - name: Retain canonical parity result sets
        uses: actions/upload-artifact@v4
        with:
          name: agent-parity-results
          path: /tmp/anvilkit-agent-parity
          if-no-files-found: error
      - name: Canonical contract profile and lock
        run: bun packages/contracts-codegen/check-agent-profile.ts
      - name: Agent Service pinned client and schema drift
        working-directory: services/agent-service
        run: bash scripts/check-contract-drift.sh
      - name: No codegen drift (platform)
        run: git diff --exit-code
      - name: No codegen drift (worker submodule)
        run: git -C services/export-worker diff --exit-code
      - name: No contract intake drift (agent-service submodule)
        run: git -C services/agent-service diff --exit-code

  agent-service:
    name: Agent Service (boundary, vet, race, integration, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: agent-service-ci
          POSTGRES_DB: agent_service_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_service_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/agent-service/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: services/agent-service
      - name: Format, vet, boundaries, contract drift, race tests, and build
        working-directory: services/agent-service
        run: make ci
      - name: Postgres persistence, concurrency, replay, and create-latency proofs
        working-directory: services/agent-service
        env:
          POSTGRES_TEST_URL: postgres://postgres:agent-service-ci@127.0.0.1:5432/agent_service_ci?sslmode=disable
          DURABLE_CREATE_LOAD_TEST: "1"
          DURABLE_CREATE_LOAD_DURATION: 25s
          DURABLE_CREATE_EVIDENCE_PATH: .evidence/durable-create/create-floor.json
        run: go test -race -count=1 -v ./internal/persistence ./internal/journal/postgres
      - name: DBOS durable-step, wait, cancel, and two-executor proofs
        working-directory: services/agent-service
        env:
          DBOS_TEST_URL: postgres://postgres:agent-service-ci@127.0.0.1:5432/agent_service_ci?sslmode=disable
        run: go test -race -count=1 ./internal/workflow/dbos
      - name: DBOS subprocess SIGKILL, recovery, and pinned-load proof
        working-directory: services/agent-service
        env:
          DBOS_SYSTEM_DATABASE_URL: postgres://postgres:agent-service-ci@127.0.0.1:5432/agent_service_ci?sslmode=disable
          DBOS_JOURNAL_URL: postgres://postgres:agent-service-ci@127.0.0.1:5432/agent_service_ci?sslmode=disable
        run: bash scripts/dbos-proof.sh
      - name: Retain committed-SHA evidence manifests
        working-directory: services/agent-service
        run: |
          mkdir -p .evidence/runtime .evidence/durable-create
          printf '{"schemaVersion":1,"serviceSha":"%s","postgres":"17","goVersion":"%s","race":true,"lint":true,"boundaryCheck":true,"contractDrift":true,"workflowFailover":true}\n' "$(git rev-parse HEAD)" "$(go env GOVERSION)" > .evidence/runtime/ci-manifest.json
          printf '{"schemaVersion":1,"serviceSha":"%s","platformSha":"%s","postgres":"17","goVersion":"%s","classification":"minimum-traffic-floor-precheck"}\n' "$(git rev-parse HEAD)" "${GITHUB_SHA}" "$(go env GOVERSION)" > .evidence/durable-create/environment.json
      - uses: actions/upload-artifact@v4
        with:
          name: agent-service-runtime-evidence-${{ github.sha }}
          path: services/agent-service/.evidence/runtime/ci-manifest.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: agent-service-durable-create-floor-evidence-${{ github.sha }}
          path: services/agent-service/.evidence/durable-create
          if-no-files-found: error

  worker:
    name: Worker (lint, vet, unit + integration, build)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/export-worker/go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          working-directory: services/export-worker
      - name: Start MinIO (storage/export integration tests)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
      - name: go vet
        working-directory: services/export-worker
        run: go vet ./...
      - name: Unit + integration tests (race detector)
        working-directory: services/export-worker
        env:
          REDIS_TEST_URL: redis://localhost:6379
          S3_TEST_ENDPOINT: http://localhost:9000
        run: go test -race -count=1 ./...
      - name: Build
        working-directory: services/export-worker
        run: go build ./...

  mocks:
    name: Mocks (contract conformance, FR-022)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/export-worker/go.mod
      - name: go vet
        working-directory: mocks
        run: go vet ./...
      - name: Conformance and fake-provider candidate tests
        working-directory: mocks
        run: go test -race -count=1 ./...
      - name: Build
        working-directory: mocks
        run: go build ./...

  images:
    name: Container images (build-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Worker image (EW-K8S-001)
        run: docker build --build-arg VERSION=${{ github.sha }} -t anvilkit-export-worker:${{ github.sha }} services/export-worker
      - name: deployment-service-mock image
        run: docker build -f mocks/Dockerfile --build-arg SERVICE=deployment-service-mock -t anvilkit-deployment-service-mock:${{ github.sha }} .
      - name: asset-service-mock image
        run: docker build -f mocks/Dockerfile --build-arg SERVICE=asset-service-mock -t anvilkit-asset-service-mock:${{ github.sha }} .
      - name: render-origin-mock image
        run: docker build -f mocks/Dockerfile --build-arg SERVICE=render-origin-mock -t anvilkit-render-origin-mock:${{ github.sha }} .
      - name: Compose config validation
        run: docker compose -f infra/docker-compose.yml config --quiet
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/export-worker/go.mod
      - name: Kubernetes manifest validation (kubeconform)
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@latest
          sed 's/IMAGE_TAG/ci-validation/' infra/k8s/export-worker-deployment.yaml | \
            $(go env GOPATH)/bin/kubeconform -strict -summary -
          $(go env GOPATH)/bin/kubeconform -strict -summary infra/k8s/export-worker-config.example.yaml
      - name: Alert rules validation (promtool)
        run: |
          docker run --rm -v "$PWD/infra/alerts:/rules:ro" --entrypoint promtool \
            prom/prometheus:latest check rules /rules/export-worker-rules.yaml

  audit:
    name: Dependency audit (AC-002, AC-018)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Install pinned Bun workspace
        run: bun install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/export-worker/go.mod
      - name: Platform + worker dependency audit
        run: bun scripts/dependency-audit.ts
      - name: Capability-based naming governance
        run: |
          bun test scripts/naming-governance.test.ts
          bun scripts/naming-governance.ts
      # The Agent Service release-evidence and resource-regression audits are
      # deliberately absent here and run as local/release prechecks instead
      # (scripts/release-precheck.sh). Their inputs are the retained local
      # evidence ADR-023 keeps out of Git, so a hosted clean checkout cannot
      # read them: running them here would either fail on every commit or,
      # worse, invite the evidence to be committed to make the job pass, which
      # is exactly the tracked-documentation boundary ADR-023 draws. The checks
      # are retained in full, not weakened -- they are a gate on the release
      # candidate, run where their inputs exist.
      - name: govulncheck (worker)
        working-directory: services/export-worker
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
