# Environment promotion (EW-K8S-004; ADR-008: dev → staging → production
# with a manual approval gate into production, implemented via GitHub
# environment protection rules on the "production" environment).
#
# ACTIVATION IS GATED ON BD-006: this workflow refuses to run until the
# target cluster is provisioned and its kubeconfig is registered as the
# KUBECONFIG_B64 environment secret (secret-manager wiring per ADR-006 —
# secrets are never repo files). Until then it exists as the reviewed,
# ready-to-enable promotion pipeline.
name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev, staging, production]
      service:
        description: "Which service to promote"
        required: true
        type: choice
        options: [export-worker, agent-service, all, page-change-manager, page-candidate-specialist]
      image_tag:
        description: "Immutable image tag to deploy (git sha or vX.Y.Z — never latest; unused for runtime units)"
        required: false
        type: string
      image_digest:
        description: "Released image digest (sha256:...) — required for runtime units, which deploy by digest only"
        required: false
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The Agent Runtime Unit deployment material lives in the pinned
          # agent-runtimes submodule; promoting a unit applies that material.
          submodules: recursive
      - name: BD-006 gate — cluster must be provisioned
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::No cluster is provisioned for '${{ inputs.environment }}' yet (BD-006/ADR-006)."
            echo "Register the environment's kubeconfig as the KUBECONFIG_B64 secret to enable deploys."
            exit 1
          fi
      - name: Reject mutable tags and unresolved digests
        run: |
          case "${{ inputs.service }}" in
            page-change-manager|page-candidate-specialist)
              # Runtime units deploy by immutable digest only: a tag would let
              # the running image change without a release, and a result could
              # then be attributed to a binding that never produced it.
              if ! printf '%s' "${{ inputs.image_digest }}" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
                echo "::error::Runtime units require image_digest (sha256:<64 hex>); tags are refused"; exit 1
              fi ;;
            *)
              case "${{ inputs.image_tag }}" in
                latest|main|"") echo "::error::Immutable tags only (ADR-008)"; exit 1 ;;
              esac ;;
          esac
      - name: Configure cluster access
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
      - name: Apply export-worker (rolling update; SIGTERM drain does the rest)
        if: inputs.service == 'export-worker' || inputs.service == 'all'
        run: |
          sed "s/IMAGE_TAG/${{ inputs.image_tag }}/" infra/k8s/export-worker-deployment.yaml | \
            kubectl apply -f -
          kubectl rollout status deployment/export-worker --timeout=5m
      # The Agent Service is a StatefulSet (ADR-024): the manifest carries the
      # headless Service and the per-instance stream-cursor claim alongside the
      # workload, so one apply covers all three. Rollout is ordered, and each
      # instance's ordered shutdown runs inside its 45s grace period.
      #
      # The ConfigMap is deliberately not applied here: the file in this
      # repository is an example, and the deployed configuration — like the
      # Secret beside it — comes from the environment's own configuration
      # management per ADR-006.
      - name: Apply agent-service (ordered rollout; retained cursor claims)
        if: inputs.service == 'agent-service' || inputs.service == 'all'
        run: |
          sed "s/IMAGE_TAG/${{ inputs.image_tag }}/" infra/k8s/agent-service-statefulset.yaml | \
            kubectl apply -f -
          kubectl rollout status statefulset/agent-service --timeout=10m
      # Each Agent Runtime Unit is promoted on its own: its identity and
      # network boundary, then its digest-pinned Deployment. Rolling out — or
      # rolling back, which is this same dispatch with the previous released
      # digest — changes which release serves NEW work only: Runs already
      # executing stay pinned to the manifest and image that started them, and
      # the maxUnavailable:0 strategy plus the unit's SIGTERM drain let their
      # in-flight tasks finish on the old pods.
      - name: Apply runtime unit (identity, network boundary, digest-pinned deployment)
        if: inputs.service == 'page-change-manager' || inputs.service == 'page-candidate-specialist'
        run: |
          unit="${{ inputs.service }}"
          kubectl apply -f "services/agent-runtimes/agents/$unit/deploy/identity.yaml"
          rendered=$(mktemp)
          sed "s|REPLACED_AT_RELEASE_BY_DIGEST|ghcr.io/anvilkit/$unit@${{ inputs.image_digest }}|" \
            "services/agent-runtimes/agents/$unit/deploy/deployment.yaml" > "$rendered"
          if grep -q REPLACED_AT_RELEASE_BY_DIGEST "$rendered"; then
            echo "::error::Unresolved digest placeholder survived rendering"; exit 1
          fi
          kubectl apply -f "$rendered"
          kubectl rollout status "deployment/$unit" --timeout=5m
